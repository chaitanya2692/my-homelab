apiVersion: v1
kind: Service
metadata:
  name: pricebuddy
spec:
  selector:
    app.kubernetes.io/name: pricebuddy
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: pricebuddy-scraper
spec:
  selector:
    app.kubernetes.io/name: pricebuddy-scraper
  ports:
    - name: http
      port: 3000
      targetPort: http
