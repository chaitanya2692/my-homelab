apiVersion: batch/v1
kind: Job
metadata:
  name: pricebuddy-seed-swedish-stores-v1
  labels:
    app.kubernetes.io/name: pricebuddy
    app.kubernetes.io/component: store-seed
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricebuddy
        app.kubernetes.io/component: store-seed
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              until [ "$(psql -XtAc "SELECT to_regclass('public.stores') IS NOT NULL")" = "t" ]; do
                sleep 5
              done

              psql -v ON_ERROR_STOP=1 -c "
                INSERT INTO public.stores (name, slug, domains, scrape_strategy, settings, created_at, updated_at)
                SELECT seed.name,
                       seed.slug,
                       json_build_array(
                         json_build_object('domain', seed.domain),
                         json_build_object('domain', 'www.' || seed.domain)
                       ),
                       json_build_object(
                         'title', json_build_object('type', 'schema_org'),
                         'price', json_build_object('type', 'schema_org'),
                         'image', json_build_object('type', 'schema_org'),
                         'availability', json_build_object('type', 'schema_org')
                       ),
                       json_build_object(
                         'scraper_service', 'http',
                         'locale_settings', json_build_object('locale', 'sv-SE', 'currency', 'SEK')
                       ),
                       NOW(),
                       NOW()
                FROM (VALUES
                  ('ICA', 'ica-se', 'handla.ica.se'),
                  ('Coop', 'coop-se', 'coop.se'),
                  ('Willys', 'willys-se', 'willys.se'),
                  ('Hemköp', 'hemkop-se', 'hemkop.se'),
                  ('Apotea', 'apotea-se', 'apotea.se')
                ) AS seed(name, slug, domain)
                WHERE NOT EXISTS (
                  SELECT 1 FROM public.stores existing WHERE existing.slug = seed.slug
                )
              "
          env:
            - name: PGHOST
              value: pricebuddy-db-rw
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: pricebuddy
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-credentials
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
