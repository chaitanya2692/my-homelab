apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricebuddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pricebuddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricebuddy
    spec:
      securityContext:
        fsGroup: 33
      initContainers:
        - name: wait-for-db
          image: busybox:1.38.0
          command:
            - /bin/sh
            - -c
            - until nc -z pricebuddy-db-rw 5432; do sleep 5; done
      containers:
        - name: app
          image: jez500/pricebuddy:v1.0.54
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: https://pricebuddy.my-homelab.party
            - name: ASSET_URL
              value: https://pricebuddy.my-homelab.party
            - name: SESSION_SECURE_COOKIE
              value: "true"
            - name: TRUSTED_PROXIES
              value: "*"
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              value: pricebuddy-db-rw
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: pricebuddy
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-credentials
                  key: password
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-credentials
                  key: APP_KEY
            - name: APP_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-credentials
                  key: APP_USER_EMAIL
            - name: APP_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-credentials
                  key: APP_USER_PASSWORD
            - name: SCRAPER_BASE_URL
              value: http://pricebuddy-scraper:3000
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: pricebuddy-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricebuddy-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pricebuddy-scraper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricebuddy-scraper
    spec:
      containers:
        - name: scraper
          image: jez500/seleniumbase-scrapper:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
